<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanko</title>
    <style>
        #kontener {
            width: 50px;
            height: 50px;
            background-color: lightgray;
            border: 1px solid black;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .wyroznione {
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #artykul {
            width: 150px;
            display: block;
            margin-bottom: 10px;
        }
        #liczba {
            font-weight: bold;
            color: blue;
        }

        
    </style>
</head>
<body>

    <!--Zadanie 1-->
    <div id="kontener">Marcin Dobrowiciel</div>

    <!--Zadanie 2-->
    <p class="wyroznione">Radom</p>

    <!--Zadanie 3-->
    <input type="text" id="artykul" placeholder="Wpisz tekst...">
    <div id="liczba"></div>

    <script src="script.js"></script>
</body>
</html>
